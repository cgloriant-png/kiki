name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup environment
        run: |
          cp .env.example .env 2>/dev/null || touch .env

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Wrapper & Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.11.1
          ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Prepare APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Planning_Paramoteur.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: release-${{ github.run_number }}
          name: "Planning Paramoteur v1.0.${{ github.run_number }}"
          body: "Application prête à être installée sur votre smartphone Android. Téléchargez le fichier **Planning_Paramoteur.apk** ci-dessous."
          files: release-output/Planning_Paramoteur.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


