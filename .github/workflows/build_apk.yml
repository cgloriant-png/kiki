name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup environment
        run: |
          cp .env.example .env || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Planning_Paramoteur.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest-build release-output/Planning_Paramoteur.apk \
            --title "Dernière Version - APK Paramoteur" \
            --notes "APK généré automatiquement. Téléchargez le fichier Planning_Paramoteur.apk ci-dessous pour l'installer sur votre téléphone Android." \
            --clobber || gh release upload latest-build release-output/Planning_Paramoteur.apk --clobber

