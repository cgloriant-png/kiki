name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup environment
        run: |
          cp .env.example .env 2>/dev/null || touch .env

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Planning_Paramoteur.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="v1.0.${{ github.run_number }}"
          gh release create "$TAG_NAME" release-output/Planning_Paramoteur.apk \
            --title "Planning Paramoteur $TAG_NAME" \
            --notes "Téléchargez l'application **Planning_Paramoteur.apk** ci-dessous pour l'installer sur votre smartphone ou tablette Android." \
            --latest || gh release upload "$TAG_NAME" release-output/Planning_Paramoteur.apk --clobber || true

      - name: Upload Artifact (Fallback)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Planning_Paramoteur_APK
          path: release-output/Planning_Paramoteur.apk
          retention-days: 1

